openapi: 3.1.0
info:
  title: Zecpath AI Integration API
  version: '1.0'
  description: 'GENERATED from parsers/integration_contract.py (Day 59). A PLAN, not a deployed service: the gateway, queue
    and job store do not exist yet. Timeouts, limits and token lifetimes are PROPOSED.'
servers:
- url: https://ai.zecpath.example.com/v1/ai
  description: Placeholder, not deployed
paths:
  /resumes/parse:
    post:
      operationId: parse_resume
      summary: Read a resume file and return its text, sections, skills, experience, education and certifications
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      x-mode: async
      x-implementation: ats_engine.resume_parsing_service.ResumeParsingService
      x-status: service
      x-timeout-seconds: 60.0
      x-max-body-bytes: 16384
      x-async-result-schema: ParseResumeResult
      responses:
        '202':
          description: Accepted; poll GET /jobs/{job_id}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '413':
          $ref: '#/components/responses/E413'
        '415':
          $ref: '#/components/responses/E415'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
        '504':
          $ref: '#/components/responses/E504'
      security:
      - serviceToken:
        - ai:resume:parse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseResumeRequest'
  /ats/score:
    post:
      operationId: score_ats
      summary: Score one resume against one job description (Day 57 ATSService)
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
      x-mode: sync
      x-implementation: ats_engine.service.ATSService
      x-status: service
      x-timeout-seconds: 2.0
      x-max-body-bytes: 1048576
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ATSScoreResult'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '413':
          $ref: '#/components/responses/E413'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
        '504':
          $ref: '#/components/responses/E504'
      security:
      - serviceToken:
        - ai:ats:score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ATSScoreRequest'
  /ats/score-batch:
    post:
      operationId: score_ats_batch
      summary: Score many resumes against one job description, one result each
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      x-mode: async
      x-implementation: ats_engine.batch_service.ATSBatchService
      x-status: service
      x-timeout-seconds: 120.0
      x-max-body-bytes: 10485760
      x-async-result-schema: ATSBatchScoreResult
      responses:
        '202':
          description: Accepted; poll GET /jobs/{job_id}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '413':
          $ref: '#/components/responses/E413'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
        '504':
          $ref: '#/components/responses/E504'
      security:
      - serviceToken:
        - ai:ats:score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ATSBatchScoreRequest'
  /screening/score:
    post:
      operationId: score_screening
      summary: Score a screening-call conversation that has already happened (Day 57 ScreeningService)
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
      x-mode: sync
      x-implementation: screening_ai.service.ScreeningService
      x-status: service
      x-timeout-seconds: 2.0
      x-max-body-bytes: 2097152
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningScoreResult'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '413':
          $ref: '#/components/responses/E413'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
        '504':
          $ref: '#/components/responses/E504'
      security:
      - serviceToken:
        - ai:screening:score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreeningScoreRequest'
  /interviews/score:
    post:
      operationId: score_interview
      summary: Score the answers of an HR or technical interview in real time (Day 57 InterviewIntelligenceService)
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
      x-mode: sync
      x-implementation: interview_ai.service.InterviewIntelligenceService
      x-status: service
      x-timeout-seconds: 2.0
      x-max-body-bytes: 2097152
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewScoreResult'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '413':
          $ref: '#/components/responses/E413'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
        '504':
          $ref: '#/components/responses/E504'
      security:
      - serviceToken:
        - ai:interview:score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewScoreRequest'
  /decisions/recommend:
    post:
      operationId: recommend_decision
      summary: Combine the round scores into a hiring-fit score and a RECOMMENDATION a person acts on (Day 57 DecisionScoringService)
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
      x-mode: sync
      x-implementation: scoring.service.DecisionScoringService
      x-status: service
      x-timeout-seconds: 2.0
      x-max-body-bytes: 16384
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '413':
          $ref: '#/components/responses/E413'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
        '504':
          $ref: '#/components/responses/E504'
      security:
      - serviceToken:
        - ai:decision:recommend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
  /jobs/{job_id}:
    get:
      operationId: get_job
      summary: Read the status, and when finished the result, of an asynchronous job
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^job_[A-Za-z0-9]{8,40}$
      x-mode: sync
      x-status: planned
      x-timeout-seconds: 2.0
      x-max-body-bytes: 1048576
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '413':
          $ref: '#/components/responses/E413'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
        '504':
          $ref: '#/components/responses/E504'
      security:
      - serviceToken:
        - ai:jobs:read
  /jobs/{job_id}/cancel:
    post:
      operationId: cancel_job
      summary: Cancel a queued or running job
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^job_[A-Za-z0-9]{8,40}$
      x-mode: sync
      x-status: planned
      x-timeout-seconds: 2.0
      x-max-body-bytes: 1048576
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '413':
          $ref: '#/components/responses/E413'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
        '504':
          $ref: '#/components/responses/E504'
      security:
      - serviceToken:
        - ai:jobs:cancel
  /health:
    get:
      operationId: health
      summary: Liveness and versions; no personal data, no authentication
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
      x-mode: sync
      x-status: planned
      x-timeout-seconds: 1.0
      x-max-body-bytes: 1048576
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      security: []
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived service token (client credentials over mTLS); scopes per operation.
  schemas:
    ErrorCode:
      type: string
      enum:
      - invalid_payload
      - invalid_input
      - missing_field
      - invalid_score
      - too_large
      - unsupported_value
      - internal_error
      - unsupported_type
      - file_not_found
      - empty_file
      - corrupt_file
      - unauthenticated
      - forbidden
      - not_found
      - conflict
      - idempotency_conflict
      - rate_limited
      - service_unavailable
      - timeout
    ErrorBody:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        field:
          type:
          - string
          - 'null'
      required:
      - code
      - message
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        service:
          type: string
        model_version:
          type: string
        api_version:
          type: string
        status:
          const: error
        error:
          $ref: '#/components/schemas/ErrorBody'
        request_id:
          type: string
        retryable:
          type: boolean
        retry_after_seconds:
          type:
          - number
          - 'null'
      required:
      - api_version
      - status
      - error
      - request_id
      - retryable
      additionalProperties: true
    ServiceErrorEnvelope:
      type: object
      properties:
        service:
          type: string
        model_version:
          type: string
        api_version:
          type: string
        status:
          const: error
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - api_version
      - status
      - error
      additionalProperties: true
    Warnings:
      type: array
      items:
        type: string
    ParseResumeRequest:
      type: object
      properties:
        candidate_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
          description: The PSEUDONYMOUS candidate reference (Day 55 `cref_...`), never a name or an email.
        file_ref:
          type: string
          minLength: 1
          maxLength: 512
          description: A key inside the resume store.
        file_type:
          enum:
          - pdf
          - docx
        as_of_date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: What 'Present' means for a current job. Pin it for repeatable results.
      required:
      - candidate_id
      - file_ref
      - file_type
      additionalProperties: false
    ParseResumeResult:
      type: object
      properties:
        service:
          const: resume_parsing_service
        model_version:
          type: string
        api_version:
          const: '1.0'
        status:
          const: success
        candidate_id:
          type: string
        file_type:
          enum:
          - pdf
          - docx
        as_of_date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        has_text:
          type: boolean
        line_count:
          type: integer
          minimum: 0
        detected_sections:
          type: array
          items:
            type: string
        cleaned_text:
          type: string
          description: CONTAINS PERSONAL DATA (it is the resume). Never log it.
        skills:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              group:
                type: string
              category:
                type: string
              confidence:
                type: number
                minimum: 0
                maximum: 1
              method:
                type: string
              mentions:
                type: array
                items:
                  type: string
            required:
            - name
            - confidence
            additionalProperties: true
        experience:
          type: object
          properties:
            total_years:
              type: number
              minimum: 0
            total_months:
              type: integer
              minimum: 0
            entries:
              type: array
              items:
                type: object
                properties:
                  title:
                    type: string
                  company:
                    type: string
                  start_year:
                    type: integer
                    minimum: 0
                  start_month:
                    type: integer
                    minimum: 1
                    maximum: 12
                  end_year:
                    type:
                    - integer
                    - 'null'
                  end_month:
                    type:
                    - integer
                    - 'null'
                  is_current:
                    type: boolean
                  description:
                    type: string
                required:
                - title
                - company
                - start_year
                - start_month
                - is_current
                additionalProperties: true
            gaps:
              type: array
              items:
                type: object
                properties:
                  start:
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  end:
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                required:
                - start
                - end
                additionalProperties: true
            overlap_count:
              type: integer
              minimum: 0
          required:
          - total_years
          - total_months
          - entries
          additionalProperties: true
        education:
          type: array
          items:
            type: object
            properties:
              raw_degree:
                type: string
              degree:
                type: string
              level:
                type:
                - string
                - 'null'
              field_of_study:
                type:
                - string
                - 'null'
              institution:
                type: string
              year:
                type: integer
                minimum: 0
            required:
            - degree
            - institution
            - year
            additionalProperties: true
        certifications:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              issuer:
                type:
                - string
                - 'null'
              year:
                type:
                - integer
                - 'null'
              category:
                type: string
            required:
            - name
            additionalProperties: true
        warnings:
          $ref: '#/components/schemas/Warnings'
      required:
      - service
      - model_version
      - api_version
      - status
      - candidate_id
      - file_type
      - as_of_date
      - has_text
      - cleaned_text
      - skills
      - experience
      - education
      - certifications
      - warnings
      additionalProperties: true
    ATSScoreRequest:
      type: object
      properties:
        resume_text:
          type: string
          maxLength: 200000
        job_description:
          type: string
          maxLength: 200000
          pattern: \S
        job_requirements:
          type: array
          items:
            type: string
          maxItems: 200
          deprecated: true
          description: 'DEPRECATED keyword-coverage mode: the result is NOT an ATS score.'
      additionalProperties: false
      anyOf:
      - required:
        - job_description
      - required:
        - job_requirements
    ATSScoreEngineResult:
      type: object
      properties:
        service:
          const: ats_ai_service
        model_version:
          type: string
        api_version:
          const: '1.0'
        status:
          const: success
        scoring_mode:
          const: ats_engine
        ats_score:
          type: number
          minimum: 0
          maximum: 100
        zone:
          enum:
          - shortlist
          - review
          - reject
        role_category:
          type: string
        components:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              score:
                type:
                - number
                - 'null'
              available:
                type: boolean
            required:
            - name
            - available
            additionalProperties: true
        warnings:
          $ref: '#/components/schemas/Warnings'
      required:
      - service
      - model_version
      - api_version
      - status
      - scoring_mode
      - ats_score
      - zone
      - components
      - warnings
      additionalProperties: true
    ATSScoreKeywordResult:
      type: object
      properties:
        service:
          const: ats_ai_service
        model_version:
          type: string
        api_version:
          const: '1.0'
        status:
          const: success
        scoring_mode:
          const: keyword_coverage
        ats_score:
          type: number
          minimum: 0
          maximum: 100
        matched_keywords:
          type: array
          items:
            type: string
        warnings:
          $ref: '#/components/schemas/Warnings'
      required:
      - service
      - model_version
      - api_version
      - status
      - scoring_mode
      - ats_score
      - matched_keywords
      - warnings
      additionalProperties: true
    ATSScoreResult:
      oneOf:
      - $ref: '#/components/schemas/ATSScoreEngineResult'
      - $ref: '#/components/schemas/ATSScoreKeywordResult'
    ATSBatchScoreRequest:
      type: object
      properties:
        job_description:
          type: string
          maxLength: 200000
          pattern: \S
        candidates:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            properties:
              candidate_id:
                type: string
                pattern: ^[A-Za-z0-9_-]{1,64}$
                description: The PSEUDONYMOUS candidate reference (Day 55 `cref_...`), never a name or an email.
              resume_text:
                type: string
                maxLength: 200000
            required:
            - candidate_id
            - resume_text
            additionalProperties: false
      required:
      - job_description
      - candidates
      additionalProperties: false
    ATSBatchScoreResult:
      type: object
      properties:
        service:
          const: ats_batch_service
        model_version:
          type: string
        api_version:
          const: '1.0'
        status:
          const: success
        scoring_basis:
          const: per_pair
        total:
          type: integer
          minimum: 0
        succeeded:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            type: object
            properties:
              candidate_id:
                type: string
              outcome:
                oneOf:
                - $ref: '#/components/schemas/ATSScoreResult'
                - $ref: '#/components/schemas/ServiceErrorEnvelope'
            required:
            - candidate_id
            - outcome
            additionalProperties: true
        warnings:
          $ref: '#/components/schemas/Warnings'
      required:
      - service
      - model_version
      - api_version
      - status
      - scoring_basis
      - total
      - succeeded
      - failed
      - results
      additionalProperties: true
    ScreeningScoreRequest:
      type: object
      properties:
        candidate_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
          description: The PSEUDONYMOUS candidate reference (Day 55 `cref_...`), never a name or an email.
        job_role:
          type: string
          maxLength: 200
        turns:
          type: array
          maxItems: 200
          items:
            type: object
            properties:
              text:
                type: string
                maxLength: 20000
              confidence:
                type: number
                minimum: 0
                maximum: 1
              is_silent:
                type: boolean
            required:
            - text
            additionalProperties: false
      additionalProperties: false
    ScreeningScoreResult:
      type: object
      properties:
        service:
          const: screening_ai_service
        model_version:
          type: string
        api_version:
