          - 'null'
        hiring_fit_score:
          type: number
          minimum: 0
          maximum: 100
        decision:
          enum:
          - selected
          - hold_review
          - rejected
        hold_kind:
          enum:
          - pending_evidence
          - mid_score
          - selection_blocked
          - insufficient_evidence_to_reject
          - null
        confidence:
          type:
          - number
          - 'null'
